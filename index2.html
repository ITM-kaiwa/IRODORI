<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>教員用ロールプレイカード (スマホ版) Ver 0.7</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, 'Hiragino Sans', 'Meiryo', sans-serif;
  background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  color: #333;
  padding: 12px 10px 24px;
}
.container {
  max-width: 540px;
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

/* ヘッダーエリア */
header {
  text-align: center;
  padding: 6px 0;
}
h1 {
  font-size: 1.4em;
  color: #1e293b;
  letter-spacing: 1px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.sub-title {
  font-size: 0.85em;
  color: #64748b;
  font-weight: 600;
  margin-top: 2px;
}

/* ドロップダウン選択エリア */
.selector-box {
  background: #ffffff;
  padding: 14px 16px;
  border-radius: 16px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.selector-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.selector-label {
  font-size: 0.85em;
  font-weight: bold;
  color: #475569;
}
.styled-select {
  width: 100%;
  padding: 11px 14px;
  font-size: 1.0em;
  font-weight: 600;
  border: 2px solid #007BFF;
  border-radius: 12px;
  background-color: #f8fafc;
  color: #1e293b;
  outline: none;
  cursor: pointer;
  transition: all 0.2s ease;
}
.styled-select:focus {
  border-color: #00c4b4;
  background-color: #ffffff;
  box-shadow: 0 0 0 3px rgba(0, 196, 180, 0.25);
}

/* 前後ナビゲーションボタン */
.nav-buttons {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-top: 2px;
}
.btn-nav {
  flex: 1;
  padding: 8px 12px;
  font-size: 0.9em;
  font-weight: bold;
  border-radius: 20px;
  background: #f1f5f9;
  border: 1px solid #cbd5e1;
  color: #334155;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.btn-nav:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

/* 教員用カードエリア */
.role-card {
  background-color: #ffffff;
  border-radius: 14px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
  border: 1px solid #94a3b8;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: all 0.3s ease;
}
.card-header-bar {
  background: linear-gradient(45deg, #bdd78e, #a7cb70);
  color: #1e3a1e;
  padding: 12px 16px;
  font-size: 1.1em;
  font-weight: bold;
  border-bottom: 2px solid #8ab84d;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.card-body {
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.role-title {
  border-bottom: 2px solid #e2e8f0;
  padding-bottom: 6px;
}
.role-title-jp {
  font-size: 1.25em;
  font-weight: bold;
  color: #1e293b;
}

/* 指示リスト */
.instruction-box {
  background-color: #f8fafc;
  border-radius: 10px;
  padding: 12px 14px;
  border-left: 4px solid #10b981;
  background-color: #f0fdf4;
}
.section-tag {
  display: inline-block;
  font-size: 0.8em;
  font-weight: bold;
  padding: 2px 8px;
  border-radius: 6px;
  margin-bottom: 6px;
  text-transform: uppercase;
  background-color: #dcfce7;
  color: #15803d;
}
.instruction-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.instruction-list li {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  font-size: 1.05em;
  line-height: 1.6;
}
.instruction-list .arrow {
  color: #15803d;
  font-weight: bold;
  flex-shrink: 0;
}

/* ルビ */
ruby {
  ruby-align: center;
}
rt {
  font-size: 0.6em;
  color: #475569;
}

/* 未選択プレースホルダー */
.card-empty-placeholder {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  min-height: 180px;
  color: #94a3b8;
  padding: 24px 16px;
  text-align: center;
  font-size: 1.0em;
  line-height: 1.6;
}
.card-empty-placeholder .badge {
  display: inline-block;
  padding: 5px 15px;
  border-radius: 20px;
  background-color: #e2e8f0;
  color: #475569;
  font-weight: bold;
  margin-bottom: 10px;
}

/* 学生カード確認アコーディオン */
.student-accordion {
  background: #ffffff;
  border-radius: 12px;
  border: 1px solid #cbd5e1;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
}
.accordion-toggle {
  width: 100%;
  padding: 10px 14px;
  background: #f8fafc;
  border: none;
  font-size: 0.9em;
  font-weight: 600;
  color: #0284c7;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
}
.accordion-toggle:active {
  background: #e2e8f0;
}
.accordion-content {
  display: none;
  padding: 12px 14px;
  border-top: 1px solid #e2e8f0;
  background: #ffffff;
  font-size: 0.95em;
  line-height: 1.6;
}
.accordion-content.open {
  display: block;
}
.accordion-content .tag-vn {
  background-color: #e0f2fe;
  color: #0369a1;
  display: inline-block;
  font-size: 0.75em;
  font-weight: bold;
  padding: 2px 6px;
  border-radius: 4px;
  margin-bottom: 4px;
}

/* タイマー・録音エリア */
.timer-record-box {
  background-color: #ffffff;
  border-radius: 16px;
  padding: 14px;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.timer-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
#timerDisplay {
  font-size: 2.1em;
  font-weight: bold;
  color: #e74c3c;
  min-width: 110px;
  text-align: center;
  background-color: #f8fafc;
  padding: 4px 12px;
  border-radius: 10px;
  border: 1px solid #e2e8f0;
}
button {
  padding: 10px 16px;
  font-size: 0.95em;
  font-weight: 600;
  border: none;
  border-radius: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 0.2s ease;
}
button:active {
  transform: scale(0.97);
}
.btn-timer {
  background: linear-gradient(45deg, #6c757d, #495057);
  color: white;
  flex: 1;
}
.btn-record {
  background: linear-gradient(45deg, #ef4444, #dc2626);
  color: white;
  width: 100%;
}
.btn-record.recording-active {
  background: linear-gradient(45deg, #b91c1c, #991b1b);
  animation: pulse-red 1.5s infinite;
}
@keyframes pulse-red {
  0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
  70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
  100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
}

/* 録音再生エリア */
#recordingPlaybackArea {
  display: none;
  padding: 10px;
  background-color: #f1f5f9;
  border-radius: 10px;
  text-align: center;
  font-size: 0.9em;
}
#recordingPlaybackArea audio {
  width: 100%;
  margin: 8px 0;
}
.download-link {
  color: #0284c7;
  text-decoration: none;
  font-weight: bold;
  font-size: 0.9em;
}

footer {
  margin-top: auto;
  padding: 14px 0 6px;
  width: 100%;
  text-align: center;
  color: #64748b;
  font-size: 0.85em;
}
</style>
</head>
<body>
<div class="container">
  <!-- ヘッダー -->
  <header>
    <h1><span>👁️</span> 教員用ロールカード</h1>
    <div class="sub-title">会話試験 スマホ確認画面</div>
  </header>

  <!-- カード選択ドロップダウンエリア -->
  <div class="selector-box">
    <!-- コース選択プルダウン -->
    <div class="selector-row">
      <label class="selector-label" for="courseSelect">1. コースを選択:</label>
      <select id="courseSelect" class="styled-select" onchange="onCourseChange()">
        <option value="nhapmon">入門 (A1)</option>
        <option value="socap1">初級１ (A2)</option>
        <option value="socap2" disabled>初級２ (準備中)</option>
      </select>
    </div>

    <!-- 番号選択プルダウン -->
    <div class="selector-row">
      <label class="selector-label" for="cardSelect">2. ロールプレイ番号を選択:</label>
      <select id="cardSelect" class="styled-select" onchange="onCardSelect()">
        <option value="">-- 番号を選択してください --</option>
      </select>
    </div>

    <!-- 前後送りボタン -->
    <div class="nav-buttons">
      <button class="btn-nav" id="prevCardBtn" onclick="navigateCard(-1)" disabled>◀ 前の番号</button>
      <button class="btn-nav" id="nextCardBtn" onclick="navigateCard(1)" disabled>次の番号 ▶</button>
    </div>
  </div>

  <!-- 教員用カード表示エリア -->
  <div class="role-card" id="teacherCardContainer">
    <div class="card-empty-placeholder">
      <span class="badge">教員用ロールカード</span>
      <p>上のプルダウンからカード番号を選択すると、<br>対応する教員用指示カードが表示されます。</p>
    </div>
  </div>

  <!-- 学生カード確認アコーディオン -->
  <div class="student-accordion" id="studentAccordionBox" style="display: none;">
    <button class="accordion-toggle" onclick="toggleStudentAccordion()">
      <span>📋 学生側の指示を確認する</span>
      <span id="accordionArrow">▼</span>
    </button>
    <div class="accordion-content" id="studentAccordionContent"></div>
  </div>

  <!-- タイマー ＆ 録音エリア -->
  <div class="timer-record-box">
    <div class="timer-row">
      <button class="btn-timer" onclick="startTimer(90)">⏱️ 90秒タイマー</button>
      <div id="timerDisplay">01:30</div>
    </div>
    <button class="btn-record" id="recordBtn" onclick="toggleRecording()">🎙️ 録音開始</button>

    <!-- 録音再生エリア -->
    <div id="recordingPlaybackArea">
      <div><strong>🎧 録音データ:</strong></div>
      <audio id="recordedAudioPlayer" controls></audio><br>
      <a id="downloadRecordLink" class="download-link" download="roleplay_teacher.webm">💾 録音音声（WebM）を保存</a>
    </div>
  </div>

  <!-- アラート音声ファイル -->
  <audio id="alertSound" src="https://itm-kaiwa.github.io/IRODORI/2869-preview.mp3" preload="auto"></audio>

  <!-- フッター -->
  <footer>
    Ver 0.7 &nbsp; © 2026 ITM-Group All rights Reserved.
  </footer>
</div>

<!-- 外部データファイル読み込み -->
<script src="data.js"></script>

<script>
let currentCourseCards = [];
let currentCardData = null;
let timerInterval = null;

// 録音用変数
let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;
let recordStartTime = 0;
let recordTimerInterval = null;

// ページ読み込み時の初期化
window.addEventListener("DOMContentLoaded", () => {
  onCourseChange();
});

// コース切り替え時：該当するカードを抽出して番号プルダウンを再構築
function onCourseChange() {
  if (typeof rolePlayData === "undefined" || rolePlayData.length === 0) {
    alert("data.js が正しく読み込まれていません。");
    return;
  }

  const selectedCourse = document.getElementById("courseSelect").value;
  
  // コース（入門: nhapmon_*, 初級1: socap1_*）でカードを絞り込み
  currentCourseCards = rolePlayData.filter(card => card.level.startsWith(selectedCourse));

  const cardSelect = document.getElementById("cardSelect");
  cardSelect.innerHTML = `<option value="">-- 番号を選択してください (${currentCourseCards.length}問) --</option>`;

  currentCourseCards.forEach((card, index) => {
    const opt = document.createElement("option");
    opt.value = card.id;
    opt.textContent = `${card.title}`;
    cardSelect.appendChild(opt);
  });

  // カード表示をクリア
  clearTeacherCard();
}

// 番号プルダウン変更時：選択された教員カードを表示
function onCardSelect() {
  const cardSelect = document.getElementById("cardSelect");
  const selectedId = cardSelect.value;

  if (!selectedId) {
    clearTeacherCard();
    return;
  }

  currentCardData = currentCourseCards.find(card => card.id === selectedId);
  if (!currentCardData) return;

  renderTeacherCard(currentCardData);
  updateNavButtons();
}

// 前後送りボタン
function navigateCard(direction) {
  const cardSelect = document.getElementById("cardSelect");
  const currentIndex = cardSelect.selectedIndex;
  const newIndex = currentIndex + direction;

  if (newIndex >= 1 && newIndex < cardSelect.options.length) {
    cardSelect.selectedIndex = newIndex;
    onCardSelect();
  }
}

function updateNavButtons() {
  const cardSelect = document.getElementById("cardSelect");
  const currentIndex = cardSelect.selectedIndex;
  const total = cardSelect.options.length;

  document.getElementById("prevCardBtn").disabled = (currentIndex <= 1);
  document.getElementById("nextCardBtn").disabled = (currentIndex >= total - 1 || currentIndex === 0);
}

// 教員カードを描画
function renderTeacherCard(card) {
  const container = document.getElementById("teacherCardContainer");
  const jpListHtml = card.teacher.instructions_jp
    .map(text => `<li><span class="arrow">↓</span><span>${text}</span></li>`).join("");

  container.innerHTML = `
    <div class="card-header-bar">
      <span>${card.title}</span>
    </div>
    <div class="card-body">
      <div class="role-title">
        <div class="role-title-jp">${card.teacher.role_jp_ruby || card.teacher.role_jp}</div>
      </div>
      <div class="instruction-box">
        <span class="section-tag">教員指示</span>
        <ul class="instruction-list">
          ${jpListHtml}
        </ul>
      </div>
    </div>
  `;

  // 学生側の指示確認アコーディオンもセットアップ
  const studentAccordionBox = document.getElementById("studentAccordionBox");
  const studentAccordionContent = document.getElementById("studentAccordionContent");
  
  const vnListHtml = card.student.instructions_vn
    .map(text => `<li>• ${text}</li>`).join("");
  const studentJpHtml = card.student.instructions_jp
    .map(text => `<li>• ${text}</li>`).join("");

  studentAccordionContent.innerHTML = `
    <div style="font-weight: bold; margin-bottom: 4px; color: #0284c7;">${card.student.role_vn} (${card.student.role_jp})</div>
    <span class="tag-vn">Tiếng Việt</span>
    <ul style="list-style: none; padding-left: 0; margin-bottom: 10px; color: #1e293b;">
      ${vnListHtml}
    </ul>
    <span style="display:inline-block; font-size: 0.75em; font-weight: bold; padding: 2px 6px; border-radius: 4px; background: #dcfce7; color: #15803d; margin-bottom: 4px;">日本語訳</span>
    <ul style="list-style: none; padding-left: 0; color: #475569;">
      ${studentJpHtml}
    </ul>
  `;

  studentAccordionBox.style.display = "block";
}

function clearTeacherCard() {
  currentCardData = null;
  const container = document.getElementById("teacherCardContainer");
  container.innerHTML = `
    <div class="card-empty-placeholder">
      <span class="badge">教員用ロールカード</span>
      <p>上のプルダウンからカード番号を選択すると、<br>対応する教員用指示カードが表示されます。</p>
    </div>
  `;
  document.getElementById("studentAccordionBox").style.display = "none";
  document.getElementById("prevCardBtn").disabled = true;
  document.getElementById("nextCardBtn").disabled = true;
}

// 学生カードアコーディオン開閉
function toggleStudentAccordion() {
  const content = document.getElementById("studentAccordionContent");
  const arrow = document.getElementById("accordionArrow");
  if (content.classList.contains("open")) {
    content.classList.remove("open");
    arrow.textContent = "▼";
  } else {
    content.classList.add("open");
    arrow.textContent = "▲";
  }
}

// ==========================================
// タイマー機能（90秒）
// ==========================================
function startTimer(seconds) {
  clearInterval(timerInterval);
  const display = document.getElementById("timerDisplay");
  const sound = document.getElementById("alertSound");
  const startTime = Date.now();
  const endTime = startTime + (seconds * 1000);

  updateDisplay();
  timerInterval = setInterval(updateDisplay, 200);

  function updateDisplay() {
    const now = Date.now();
    let timeLeft = Math.max(0, Math.ceil((endTime - now) / 1000));
    let minutes = Math.floor(timeLeft / 60);
    let remainingSeconds = timeLeft % 60;
    display.textContent = `${String(minutes).padStart(2, '0')}:${String(remainingSeconds).padStart(2, '0')}`;

    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      if (sound) {
        sound.currentTime = 0;
        sound.play().catch(e => console.warn("音声再生エラー:", e));
      }
      // スマホのバイブレーション（対応機種）
      if (navigator.vibrate) {
        navigator.vibrate([300, 100, 300]);
      }
      setTimeout(() => {
        alert("90秒が経過しました！");
      }, 100);
    }
  }
}

// ==========================================
// 録音機能（MediaRecorder）
// ==========================================
async function toggleRecording() {
  const recordBtn = document.getElementById("recordBtn");
  const playbackArea = document.getElementById("recordingPlaybackArea");

  if (!isRecording) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) audioChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const audioBlob = new Blob(audioChunks, { type: "audio/webm" });
        const audioUrl = URL.createObjectURL(audioBlob);
        const player = document.getElementById("recordedAudioPlayer");
        const downloadLink = document.getElementById("downloadRecordLink");

        player.src = audioUrl;
        downloadLink.href = audioUrl;
        playbackArea.style.display = "block";

        stream.getTracks().forEach(track => track.stop());
      };

      mediaRecorder.start();
      isRecording = true;
      recordStartTime = Date.now();
      recordBtn.classList.add("recording-active");
      recordBtn.innerHTML = `⏹️ 録音停止 (<span id="recSeconds">00:00</span>)`;

      recordTimerInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - recordStartTime) / 1000);
        const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
        const s = String(elapsed % 60).padStart(2, '0');
        const secEl = document.getElementById("recSeconds");
        if (secEl) secEl.textContent = `${m}:${s}`;
      }, 1000);

    } catch (err) {
      alert("マイクの使用が許可されていないか、未対応のブラウザです:\n" + err.message);
    }
  } else {
    if (mediaRecorder && mediaRecorder.state !== "inactive") {
      mediaRecorder.stop();
    }
    isRecording = false;
    clearInterval(recordTimerInterval);
    recordBtn.classList.remove("recording-active");
    recordBtn.innerHTML = `🎙️ 録音開始`;
  }
}
</script>
</body>
</html>
