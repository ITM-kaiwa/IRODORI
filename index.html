<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会話試験：ロールプレイカード生成 Ver 1.5</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, 'Hiragino Sans', 'Meiryo', sans-serif;
  background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  color: #333;
}
.container {
  max-width: 1050px;
  width: 100%;
  padding: 15px 20px;
  margin-top: 5px;
}

/* タイトルとQRコードを横並びにするヘッダーエリア */
.header-area {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}
.header-area h1 {
  text-align: center;
  color: #2c3e50;
  font-size: 1.9em;
  margin-bottom: 0;
  letter-spacing: 1.5px;
  text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
}
.qr-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.2s ease;
  flex-shrink: 0;
}
.qr-link:hover {
  transform: scale(1.08);
}
/* ★QRコードの表示サイズ（60px） */
.qr-image {
  width: 60px;
  height: 60px;
  object-fit: contain;
  background-color: #ffffff;
  padding: 2px;
  border-radius: 6px;
  border: 1px solid #cbd5e1;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
}

/* タイトル下のセレクトボックス配置エリア */
.select-container {
  display: flex;
  justify-content: center;
  align-items: center;
  margin-bottom: 18px;
}
.level-select {
  padding: 11px 22px;
  font-size: 1.05em;
  font-weight: 600;
  border: 2px solid #007BFF;
  border-radius: 25px;
  background-color: #ffffff;
  color: #1e293b;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
  outline: none;
  transition: all 0.25s ease;
  text-align-last: center;
}
.level-select:focus {
  border-color: #00c4b4;
  box-shadow: 0 4px 20px rgba(0, 196, 180, 0.3);
}
.level-select:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

/* 2枚のカード表示エリア */
.cards-container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 16px;
}
.role-card {
  background-color: #ffffff;
  border-radius: 12px;
  min-height: 220px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
  border: 2px dashed #cbd5e1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: all 0.3s ease;
  position: relative;
}
.role-card.has-content {
  border: 1px solid #94a3b8;
  min-height: auto;
}

/* ルーレット回転中のカードスタイル */
.role-card.roulette-spinning {
  border: 2px solid #007BFF;
  box-shadow: 0 0 25px rgba(0, 123, 255, 0.35);
  background: linear-gradient(180deg, #f0f9ff 0%, #ffffff 50%, #f0f9ff 100%);
}

/* ルーレット確定時のフラッシュ演出 */
.role-card.roulette-winner {
  border: 2px solid #10b981;
  animation: winnerGlow 0.9s ease-out;
}
@keyframes winnerGlow {
  0% {
    transform: scale(1.02);
    box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.85), 0 0 35px rgba(245, 158, 11, 0.6);
  }
  50% {
    transform: scale(1.01);
    box-shadow: 0 0 0 14px rgba(16, 185, 129, 0), 0 0 25px rgba(16, 185, 129, 0.5);
  }
  100% {
    transform: scale(1);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
  }
}

/* カード内容のポップインアニメーション */
.card-reveal-anim {
  animation: cardReveal 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes cardReveal {
  0% {
    opacity: 0;
    transform: translateY(10px) scale(0.98);
  }
  100% {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* ルーレット表示用UI */
.roulette-stage {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  height: 100%;
  min-height: 220px;
  padding: 20px;
  text-align: center;
  position: relative;
}
.roulette-status-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 16px;
  border-radius: 20px;
  background: linear-gradient(45deg, #007BFF, #00c4b4);
  color: #ffffff;
  font-size: 0.88em;
  font-weight: bold;
  letter-spacing: 0.5px;
  margin-bottom: 16px;
  box-shadow: 0 3px 10px rgba(0, 123, 255, 0.25);
}
.roulette-status-badge.landed {
  background: linear-gradient(45deg, #10b981, #059669);
  box-shadow: 0 3px 12px rgba(16, 185, 129, 0.4);
  transform: scale(1.06);
  transition: all 0.2s ease;
}
.roulette-window {
  width: 100%;
  max-width: 420px;
  background: #ffffff;
  border: 2px solid #cbd5e1;
  border-radius: 14px;
  padding: 18px 16px;
  box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.06), 0 4px 12px rgba(0, 0, 0, 0.05);
  position: relative;
  overflow: hidden;
}
.roulette-window::before,
.roulette-window::after {
  content: "▶";
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  color: #f59e0b;
  font-size: 1.1em;
}
.roulette-window::before {
  left: 8px;
}
.roulette-window::after {
  content: "◀";
  right: 8px;
}
.roulette-item-title {
  font-size: 1.25em;
  font-weight: 800;
  color: #1e293b;
  margin-bottom: 4px;
  transition: transform 0.06s ease;
}
.roulette-item-role {
  font-size: 1.0em;
  font-weight: 600;
  color: #0284c7;
}
.roulette-tick-anim {
  animation: slotTick 0.09s ease-out;
}
@keyframes slotTick {
  0% {
    opacity: 0.45;
    transform: translateY(-8px);
  }
  100% {
    opacity: 1;
    transform: translateY(0);
  }
}

.card-empty-placeholder {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  height: 100%;
  min-height: 200px;
  color: #94a3b8;
  padding: 20px;
  text-align: center;
  font-size: 1.05em;
  line-height: 1.6;
}
.card-empty-placeholder .badge {
  display: inline-block;
  padding: 5px 15px;
  border-radius: 20px;
  background-color: #e2e8f0;
  color: #475569;
  font-weight: bold;
  margin-bottom: 10px;
}

/* カードの中身 */
.card-header-bar {
  background-color: #bdd78e;
  color: #1e3a1e;
  padding: 10px 15px;
  font-size: 1.1em;
  font-weight: bold;
  border-bottom: 2px solid #8ab84d;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.card-body {
  padding: 18px;
  flex-grow: 1;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.role-title {
  border-bottom: 2px solid #e2e8f0;
  padding-bottom: 8px;
}
.role-title-jp {
  font-size: 1.25em;
  font-weight: bold;
  color: #1e293b;
}
.role-title-vn {
  font-size: 1.05em;
  color: #0284c7;
  font-weight: 600;
  margin-top: 3px;
}
.instruction-box {
  background-color: #f8fafc;
  border-radius: 10px;
  padding: 12px 15px;
  border-left: 4px solid #007BFF;
}
.instruction-box.jp-box {
  border-left-color: #10b981;
  background-color: #f0fdf4;
}
.section-tag {
  display: inline-block;
  font-size: 0.8em;
  font-weight: bold;
  padding: 2px 8px;
  border-radius: 6px;
  margin-bottom: 6px;
  text-transform: uppercase;
}
.tag-vn {
  background-color: #e0f2fe;
  color: #0369a1;
}
.tag-jp {
  background-color: #dcfce7;
  color: #15803d;
}
.instruction-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.instruction-list li {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  font-size: 1.05em;
  line-height: 1.6;
}
.instruction-list .arrow {
  color: #64748b;
  font-weight: bold;
  flex-shrink: 0;
}
ruby {
  ruby-align: center;
}
rt {
  font-size: 0.6em;
  color: #475569;
}

/* 学生カードの日本語非表示用スタイル */
#studentCard.hide-jp .student-jp-content {
  display: none !important;
}

/* 操作ボタングループエリア */
.controls-container {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}

/* チェックボックス（日本語表示・効果音） */
.checkbox-label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 1.0em;
  font-weight: 600;
  color: #334155;
  background-color: #ffffff;
  padding: 10px 16px;
  border-radius: 25px;
  border: 1px solid #cbd5e1;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
  cursor: pointer;
  user-select: none;
  transition: all 0.25s ease;
}
.checkbox-label:hover {
  background-color: #f8fafc;
  border-color: #94a3b8;
}
.checkbox-label input[type="checkbox"] {
  width: 18px;
  height: 18px;
  accent-color: #007BFF;
  cursor: pointer;
}

button {
  padding: 12px 24px;
  font-size: 1.05em;
  font-weight: 600;
  border: none;
  border-radius: 25px;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
  transition: all 0.25s ease;
  display: flex;
  align-items: center;
  gap: 8px;
}
button:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
}
button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}
.btn-primary {
  background: linear-gradient(45deg, #007BFF, #00c4b4);
  color: white;
}
.btn-primary.spinning-btn {
  background: linear-gradient(45deg, #f59e0b, #ef4444);
  opacity: 0.9;
}
.btn-secondary {
  background: linear-gradient(45deg, #6c757d, #495057);
  color: white;
}
.btn-teacher {
  background: linear-gradient(45deg, #f59e0b, #d97706);
  color: white;
}
.btn-reset {
  background: #ffffff;
  color: #64748b;
  border: 1px solid #cbd5e1;
}

/* タイマー・録音エリア */
.timer-record-container {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 16px;
  padding: 15px;
  background-color: #ffffff;
  border-radius: 16px;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
}
#timerDisplay {
  font-size: 2.2em;
  font-weight: bold;
  color: #e74c3c;
  min-width: 130px;
  text-align: center;
  background-color: #f8fafc;
  padding: 4px 16px;
  border-radius: 12px;
  border: 1px solid #e2e8f0;
}
.btn-record {
  background: linear-gradient(45deg, #ef4444, #dc2626);
  color: white;
}
.btn-record.recording-active {
  background: linear-gradient(45deg, #b91c1c, #991b1b);
  animation: pulse-red 1.5s infinite;
}
@keyframes pulse-red {
  0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
  70% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
  100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
}
#recordingPlaybackArea {
  display: none;
  margin-top: 15px;
  padding: 15px;
  background-color: #f1f5f9;
  border-radius: 12px;
  text-align: center;
}
#recordingPlaybackArea audio {
  width: 100%;
  max-width: 400px;
  margin: 10px 0;
}
.download-link {
  display: inline-block;
  color: #0284c7;
  text-decoration: none;
  font-weight: bold;
  font-size: 0.95em;
}
.download-link:hover {
  text-decoration: underline;
}
footer {
  margin-top: auto;
  padding: 16px;
  width: 100%;
  text-align: center;
  background-color: #2c3e50;
  color: #ecf0f1;
  font-size: 0.9em;
}

/* 画面右端の丸型ダウンロードボタン */
.btn-download-circle {
  position: fixed;
  top: 20px;
  right: 25px;
  z-index: 1000;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: linear-gradient(135deg, #107c41 0%, #15803d 100%);
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 12px rgba(16, 124, 65, 0.35);
  text-decoration: none;
  transition: all 0.25s ease;
  cursor: pointer;
}
.btn-download-circle:hover {
  transform: scale(1.1) translateY(-2px);
  box-shadow: 0 6px 18px rgba(16, 124, 65, 0.45);
  background: linear-gradient(135deg, #15803d 0%, #166534 100%);
}
.btn-download-circle:active {
  transform: scale(0.96);
}
.btn-download-circle .download-icon {
  width: 24px;
  height: 24px;
  stroke: #ffffff;
}
/* ホバーツールチップ */
.download-tooltip {
  position: absolute;
  bottom: -32px;
  right: 50%;
  transform: translateX(50%);
  background: rgba(30, 41, 59, 0.9);
  color: #ffffff;
  font-size: 11px;
  font-weight: 600;
  padding: 4px 8px;
  border-radius: 6px;
  white-space: nowrap;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.2s, visibility 0.2s;
  pointer-events: none;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
}
.btn-download-circle:hover .download-tooltip {
  opacity: 1;
  visibility: visible;
}

@media (max-width: 768px) {
  .btn-download-circle {
    top: 14px;
    right: 14px;
    width: 40px;
    height: 40px;
  }
  .btn-download-circle .download-icon {
    width: 20px;
    height: 20px;
  }
  .download-tooltip {
    display: none;
  }
  .header-area {
    gap: 8px;
  }
  .header-area h1 {
    font-size: 1.5em;
  }
  .qr-image {
    width: 45px;
    height: 45px;
  }
  .cards-container {
    grid-template-columns: 1fr;
  }
  .role-card {
    min-height: 160px;
  }
  .level-select, button, .checkbox-label {
    width: 100%;
    justify-content: center;
  }
  .timer-record-container {
    flex-direction: column;
  }
  .select-container {
    width: 100%;
  }
}
</style>
</head>
<body>
<!-- 画面右端の丸型ダウンロードボタン（評価シートExcelダウンロード） -->
<a href="IRODORI_ROLEPLAY_EVALUATION.xlsx" download="IRODORI_ROLEPLAY_EVALUATION.xlsx" class="btn-download-circle" title="評価シート（IRODORI_ROLEPLAY_EVALUATION.xlsx）をダウンロード">
  <svg class="download-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
    <polyline points="7 10 12 15 17 10"></polyline>
    <line x1="12" y1="15" x2="12" y2="3"></line>
  </svg>
  <span class="download-tooltip">評価シートDL</span>
</a>

<div class="container">
  <!-- タイトル ＆ QRコード -->
  <div class="header-area">
    <h1>会話試験：ロールプレイカード</h1>
    <a href="index2.html" target="_blank" class="qr-link" title="教員用画面を開く">
      <img src="qr.png" alt="QRコード" class="qr-image">
    </a>
  </div>

  <!-- タイトルの直下に配置した試験範囲プルダウン -->
  <div class="select-container">
    <select class="level-select" id="levelSelect" onchange="onLevelChange()">
      <optgroup label="入門 (Nhập môn)">
        <option value="nhapmon_1_4">入門：第１課から第４課 (Bài 1 - 4)</option>
        <option value="nhapmon_5_8">入門：第５課から第８課 (Bài 5 - 8)</option>
        <option value="nhapmon_9_12">入門：第９課から第１２課 (Bài 9 - 12)</option>
        <option value="nhapmon_13_16">入門：第１３課から第１６課 (Bài 13 - 16)</option>
        <option value="nhapmon_17_18">入門：第１７課と１８課 (Bài 17 - 18)</option>
      </optgroup>
      <optgroup label="初級１ (Sơ cấp 1)">
        <option value="socap1_1_4">初級１：第１課から第４課 (Bài 1 - 4)</option>
        <option value="socap1_5_8">初級１：第５課から第８課 (Bài 5 - 8)</option>
        <option value="socap1_9_10">初級１：第９課と第１０課 (Bài 9 - 10)</option>
        <option value="socap1_11_14">初級１：第１１課から第１４課 (Bài 11 - 14)</option>
        <option value="socap1_15_18">初級１：第１５課から第１８課 (Bài 15 - 18)</option>
      </optgroup>
      <optgroup label="初級２ (Sơ cấp 2)">
        <option value="socap2_1_4">初級２：第１課から第４課 (Bài 1 - 4)</option>
        <option value="socap2_5_8">初級２：第５課から第８課 (Bài 5 - 8)</option>
        <option value="socap2_9_12">初級２：第９課から第１２課 (Bài 9 - 12)</option>
        <option value="socap2_13_16">初級２：第１３課から第１６課 (Bài 13 - 16)</option>
        <option value="socap2_17_18">初級２：第１７課と第１８課 (Bài 17 - 18)</option>
      </optgroup>
    </select>
  </div>

  <!-- 2枚のカード領域（左：学生、右：教員） -->
  <div class="cards-container">
    <div class="role-card" id="studentCard">
      <div class="card-empty-placeholder">
        <span class="badge">Thẻ nhập vai học sinh</span>
        <p>Nhấn nút "Rút thẻ học sinh" bên dưới<br>để quay vòng chọn chủ đề ngẫu nhiên.</p>
      </div>
    </div>

    <div class="role-card" id="teacherCard">
      <div class="card-empty-placeholder">
        <span class="badge">教員用ロールカード</span>
        <p>学生カードが表示された後、<br>「教員カード 表示/非表示」ボタンで表示できます。</p>
      </div>
    </div>
  </div>

  <!-- 操作ボタングループ -->
  <div class="controls-container">
    <label class="checkbox-label" for="showStudentJpCheck">
      <input type="checkbox" id="showStudentJpCheck" onchange="onStudentJpCheckChange()">
      <span>日本語表示</span>
    </label>

    <label class="checkbox-label" for="rouletteSoundCheck" title="ルーレット回転時の効果音をオン/オフします">
      <input type="checkbox" id="rouletteSoundCheck" checked>
      <span>🔊 効果音</span>
    </label>

    <button class="btn-primary" id="drawCardBtn" onclick="drawRandomStudentCard()">🎰 Rút thẻ học sinh</button>
    <button class="btn-teacher" id="toggleTeacherBtn" onclick="toggleTeacherCard()" disabled>👁️ 教員カード 表示 / 非表示</button>
    <button class="btn-reset" id="resetBtn" onclick="resetAll()">🔄 リセット</button>
  </div>

  <!-- タイマー ＆ 録音エリア -->
  <div class="timer-record-container">
    <button class="btn-secondary" onclick="startTimer(90)">⏱️ 90秒タイマー</button>
    <div id="timerDisplay">01:30</div>
    <button class="btn-record" id="recordBtn" onclick="toggleRecording()">🎙️ 録音開始</button>
  </div>

  <!-- 録音停止後に表示されるオーディオプレイヤー -->
  <div id="recordingPlaybackArea">
    <div><strong>🎧 今回の録音データ:</strong></div>
    <audio id="recordedAudioPlayer" controls></audio><br>
    <a id="downloadRecordLink" class="download-link" download="roleplay_exam.webm">💾 録音音声（WebM）を保存</a>
  </div>
</div>

<!-- アラート音声ファイル -->
<audio id="alertSound" src="https://itm-kaiwa.github.io/IRODORI/2869-preview.mp3" preload="auto"></audio>

<!-- フッター -->
<footer>
  <span style="margin-right: 15px; opacity: 0.9;">Ver 1.5 (Roulette)</span>© 2026 ITM-Group All rights Reserved.
</footer>

<!-- 外部データファイル読み込み -->
<script src="data.js"></script>

<script>
let currentCardData = null;
let isTeacherCardVisible = false;
let timerInterval = null;

// ルーレット制御用変数
let isRouletteSpinning = false;
let rouletteTimeoutId = null;
let audioCtx = null;

let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;
let recordStartTime = 0;
let recordTimerInterval = null;

// Web Audio API 初期化
function getAudioContext() {
  if (!audioCtx) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (AudioContextClass) {
      audioCtx = new AudioContextClass();
    }
  }
  if (audioCtx && audioCtx.state === "suspended") {
    audioCtx.resume().catch(() => {});
  }
  return audioCtx;
}

// ルーレット回転中の軽快なティック音
function playRouletteTickSound(stepIndex, totalSteps) {
  if (!document.getElementById("rouletteSoundCheck").checked) return;
  const ctx = getAudioContext();
  if (!ctx) return;

  try {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "triangle";

    // 終盤にかけて少しずつ音程を上げて期待感を演出
    const progress = stepIndex / totalSteps;
    const freq = 520 + progress * 280;
    osc.frequency.setValueAtTime(freq, ctx.currentTime);

    gain.gain.setValueAtTime(0.12, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.055);

    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.06);
  } catch (e) {
    // 音声再生不可環境では無視
  }
}

// ルーレット確定時のファンファーレ音（ド・ミ・ソ・高いド）
function playRouletteWinSound() {
  if (!document.getElementById("rouletteSoundCheck").checked) return;
  const ctx = getAudioContext();
  if (!ctx) return;

  try {
    const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";

      const startTime = ctx.currentTime + i * 0.075;
      const duration = i === notes.length - 1 ? 0.45 : 0.18;

      osc.frequency.setValueAtTime(freq, startTime);
      gain.gain.setValueAtTime(0.16, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(startTime);
      osc.stop(startTime + duration);
    });
  } catch (e) {
    // 音声再生不可環境では無視
  }
}

function setControlsLocked(locked) {
  document.getElementById("drawCardBtn").disabled = locked;
  document.getElementById("levelSelect").disabled = locked;
  document.getElementById("resetBtn").disabled = locked;
  if (locked) {
    document.getElementById("toggleTeacherBtn").disabled = true;
  }
}

function onLevelChange() {
  resetAll();
}

function onStudentJpCheckChange() {
  const isChecked = document.getElementById("showStudentJpCheck").checked;
  const studentEl = document.getElementById("studentCard");
  if (isChecked) {
    studentEl.classList.remove("hide-jp");
  } else {
    studentEl.classList.add("hide-jp");
  }
}

function drawRandomStudentCard() {
  if (isRouletteSpinning) return;

  if (typeof rolePlayData === "undefined" || rolePlayData.length === 0) {
    alert("data.js が正しく読み込まれていないか、データが空です。");
    return;
  }

  const selectedLevel = document.getElementById("levelSelect").value;
  const selectedLevelText = document.getElementById("levelSelect").selectedOptions[0].text;
  const filteredCards = rolePlayData.filter(card => card.level === selectedLevel);

  if (filteredCards.length === 0) {
    alert(`「${selectedLevelText}」のロールカードはまだ登録されていません。\nChưa có thẻ nhập vai cho phạm vi này.`);
    return;
  }

  // 当選カードを事前に決定（前回と連続しにくいよう配慮）
  let candidatePool = filteredCards;
  if (filteredCards.length > 1 && currentCardData) {
    candidatePool = filteredCards.filter(c => c.title !== currentCardData.title);
    if (candidatePool.length === 0) candidatePool = filteredCards;
  }
  const finalCard = candidatePool[Math.floor(Math.random() * candidatePool.length)];

  // 教員カードは一旦リセットして隠す
  hideTeacherCard();

  // ルーレット演出開始
  isRouletteSpinning = true;
  setControlsLocked(true);

  const drawBtn = document.getElementById("drawCardBtn");
  drawBtn.classList.add("spinning-btn");
  drawBtn.innerHTML = `🎲 Đang quay... (抽選中)`;

  const studentEl = document.getElementById("studentCard");
  studentEl.classList.remove("has-content", "roulette-winner");
  studentEl.classList.add("roulette-spinning");

  // 回転ステップ数（全24ステップで徐々に減速）
  const totalSteps = 24;
  let currentStep = 0;
  let displayIndex = Math.floor(Math.random() * filteredCards.length);

  // ルーレット表示枠を初期化
  studentEl.innerHTML = `
    <div class="roulette-stage">
      <div class="roulette-status-badge" id="rouletteBadge">🎰 Đang chọn chủ đề...</div>
      <div class="roulette-window">
        <div class="roulette-item-title" id="rouletteTitle">---</div>
        <div class="roulette-item-role" id="rouletteRole">---</div>
      </div>
    </div>
  `;

  const titleEl = document.getElementById("rouletteTitle");
  const roleEl = document.getElementById("rouletteRole");
  const badgeEl = document.getElementById("rouletteBadge");

  function spinStep() {
    currentStep++;

    // 最終ステップでは必ず当選カードを表示
    let shownCard;
    if (currentStep >= totalSteps) {
      shownCard = finalCard;
    } else {
      if (filteredCards.length > 1) {
        displayIndex = (displayIndex + 1) % filteredCards.length;
        // 最後から2番目が当選カードと被らないように調整
        if (currentStep === totalSteps - 1 && filteredCards[displayIndex].title === finalCard.title) {
          displayIndex = (displayIndex + 1) % filteredCards.length;
        }
      } else {
        displayIndex = 0;
      }
      shownCard = filteredCards[displayIndex];
    }

    // テキスト更新とスロットアニメーション再トリガー
    titleEl.textContent = shownCard.title;
    roleEl.textContent = shownCard.student.role_vn;
    titleEl.classList.remove("roulette-tick-anim");
    void titleEl.offsetWidth; // リフロー強制
    titleEl.classList.add("roulette-tick-anim");

    if (currentStep < totalSteps) {
      playRouletteTickSound(currentStep, totalSteps);

      // イージング計算（最初は45ms、終盤にかけて最大340msまで減速）
      const progress = currentStep / totalSteps;
      const delay = Math.round(45 + Math.pow(progress, 2.6) * 295);
      rouletteTimeoutId = setTimeout(spinStep, delay);
    } else {
      // ルーレット停止・確定！
      playRouletteWinSound();
      studentEl.classList.remove("roulette-spinning");
      studentEl.classList.add("roulette-winner");
      badgeEl.classList.add("landed");
      badgeEl.textContent = "🎉 ĐÃ CHỌN CHỦ ĐỀ! (テーマ決定)";

      // 当選余韻（550ms）の後にフルカード詳細を展開
      rouletteTimeoutId = setTimeout(() => {
        currentCardData = finalCard;
        renderStudentCardDetail(finalCard);

        isRouletteSpinning = false;
        setControlsLocked(false);
        drawBtn.classList.remove("spinning-btn");
        drawBtn.innerHTML = `🎰 Rút thẻ học sinh`;
        document.getElementById("toggleTeacherBtn").disabled = false;
      }, 550);
    }
  }

  spinStep();
}

function renderStudentCardDetail(cardData) {
  const studentEl = document.getElementById("studentCard");
  studentEl.classList.add("has-content");

  const vnListHtml = cardData.student.instructions_vn
    .map(text => `<li><span class="arrow">↓</span><span>${text}</span></li>`).join("");

  const jpListHtml = cardData.student.instructions_jp
    .map(text => `<li><span class="arrow">↓</span><span>${text}</span></li>`).join("");

  studentEl.innerHTML = `
    <div class="card-header-bar card-reveal-anim">
      <span>${cardData.title}</span>
    </div>
    <div class="card-body card-reveal-anim">
      <div class="role-title">
        <div class="role-title-vn">${cardData.student.role_vn}</div>
        <div class="role-title-jp student-jp-content">${cardData.student.role_jp_ruby}</div>
      </div>
      <!-- ベトナム語（上） -->
      <div class="instruction-box">
        <span class="section-tag tag-vn">Tiếng Việt</span>
        <ul class="instruction-list">
          ${vnListHtml}
        </ul>
      </div>
      <!-- 日本語訳（下：チェックが入っている時のみ表示） -->
      <div class="instruction-box jp-box student-jp-content">
        <span class="section-tag tag-jp">日本語訳</span>
        <ul class="instruction-list">
          ${jpListHtml}
        </ul>
      </div>
    </div>
  `;

  // チェック状態を反映
  onStudentJpCheckChange();
}

function toggleTeacherCard() {
  if (!currentCardData || isRouletteSpinning) return;
  if (isTeacherCardVisible) {
    hideTeacherCard();
  } else {
    showTeacherCard();
  }
}

function showTeacherCard() {
  const teacherEl = document.getElementById("teacherCard");
  teacherEl.classList.add("has-content");

  const jpListHtml = currentCardData.teacher.instructions_jp
    .map(text => `<li><span class="arrow">↓</span><span>${text}</span></li>`).join("");

  teacherEl.innerHTML = `
    <div class="card-header-bar card-reveal-anim">
      <span>${currentCardData.title}</span>
    </div>
    <div class="card-body card-reveal-anim">
      <div class="role-title">
        <div class="role-title-jp">${currentCardData.teacher.role_jp_ruby}</div>
      </div>
      <div class="instruction-box jp-box" style="flex-grow: 1;">
        <span class="section-tag tag-jp">日本語（教員指示）</span>
        <ul class="instruction-list">
          ${jpListHtml}
        </ul>
      </div>
    </div>
  `;
  isTeacherCardVisible = true;
}

function hideTeacherCard() {
  const teacherEl = document.getElementById("teacherCard");
  teacherEl.classList.remove("has-content");
  teacherEl.innerHTML = `
    <div class="card-empty-placeholder">
      <span class="badge">教員用ロールカード</span>
      <p>「教員カード 表示/非表示」ボタンを押すと<br>学生カードに対応したカードが表示されます。</p>
    </div>
  `;
  isTeacherCardVisible = false;
}

function resetAll() {
  if (rouletteTimeoutId) {
    clearTimeout(rouletteTimeoutId);
    rouletteTimeoutId = null;
  }
  isRouletteSpinning = false;
  setControlsLocked(false);

  const drawBtn = document.getElementById("drawCardBtn");
  drawBtn.classList.remove("spinning-btn");
  drawBtn.innerHTML = `🎰 Rút thẻ học sinh`;

  currentCardData = null;
  isTeacherCardVisible = false;

  const studentEl = document.getElementById("studentCard");
  studentEl.classList.remove("has-content", "roulette-spinning", "roulette-winner");
  studentEl.innerHTML = `
    <div class="card-empty-placeholder">
      <span class="badge">Thẻ nhập vai học sinh</span>
      <p>Nhấn nút "Rút thẻ học sinh" bên dưới<br>để quay vòng chọn chủ đề ngẫu nhiên.</p>
    </div>
  `;

  hideTeacherCard();
  document.getElementById("toggleTeacherBtn").disabled = true;

  clearInterval(timerInterval);
  document.getElementById("timerDisplay").textContent = "01:30";

  if (isRecording) {
    toggleRecording();
  }
}

function startTimer(seconds) {
  clearInterval(timerInterval);
  const display = document.getElementById("timerDisplay");
  const sound = document.getElementById("alertSound");
  const startTime = Date.now();
  const endTime = startTime + (seconds * 1000);

  updateDisplay();
  timerInterval = setInterval(updateDisplay, 200);

  function updateDisplay() {
    const now = Date.now();
    let timeLeft = Math.max(0, Math.ceil((endTime - now) / 1000));
    let minutes = Math.floor(timeLeft / 60);
    let remainingSeconds = timeLeft % 60;
    display.textContent = `${String(minutes).padStart(2, '0')}:${String(remainingSeconds).padStart(2, '0')}`;

    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      if (sound) {
        sound.currentTime = 0;
        sound.play().catch(e => console.warn("音声再生エラー:", e));
      }
      setTimeout(() => {
        alert("90秒が経過しました！会話を始めてください。");
      }, 100);
    }
  }
}

async function toggleRecording() {
  const recordBtn = document.getElementById("recordBtn");
  const playbackArea = document.getElementById("recordingPlaybackArea");

  if (!isRecording) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) audioChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const audioBlob = new Blob(audioChunks, { type: "audio/webm" });
        const audioUrl = URL.createObjectURL(audioBlob);
        const player = document.getElementById("recordedAudioPlayer");
        const downloadLink = document.getElementById("downloadRecordLink");

        player.src = audioUrl;
        downloadLink.href = audioUrl;
        playbackArea.style.display = "block";

        stream.getTracks().forEach(track => track.stop());
      };

      mediaRecorder.start();
      isRecording = true;
      recordStartTime = Date.now();
      recordBtn.classList.add("recording-active");
      recordBtn.innerHTML = `⏹️ 録音停止 (<span id="recSeconds">00:00</span>)`;

      recordTimerInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - recordStartTime) / 1000);
        const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
        const s = String(elapsed % 60).padStart(2, '0');
        const secEl = document.getElementById("recSeconds");
        if (secEl) secEl.textContent = `${m}:${s}`;
      }, 1000);

    } catch (err) {
      alert("マイクの使用が許可されていないか、対応していないブラウザです:\n" + err.message);
    }
  } else {
    if (mediaRecorder && mediaRecorder.state !== "inactive") {
      mediaRecorder.stop();
    }
    isRecording = false;
    clearInterval(recordTimerInterval);
    recordBtn.classList.remove("recording-active");
    recordBtn.innerHTML = `🎙️ 録音開始`;
  }
}
</script>
